name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v2.0
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      # Configure Gradle to use the GitHub Actions workspace
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Make Gradlew executable
      run: chmod +x ./gradlew
    
    - name: Create placeholder google-services.json if not present
      run: |
        if [ ! -f app/google-services.json ]; then
          echo '{
            "project_info": {
              "project_number": "000000000000",
              "project_id": "krama-placeholder",
              "storage_bucket": "krama-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.aistudio.krama.messenger"
                }
              },
              "oauth_client": [],
              "api_key": [{
                "current_key": "AIzaSyPlaceholderKeyForBuildOnly000000000"
              }],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }],
            "configuration_version": "1"
          }' > app/google-services.json
          echo "Created placeholder google-services.json for build purposes"
        fi
        
    - name: Build Release APK
      run: ./gradlew assembleRelease
      
    - name: Locate APK files
      run: |
        echo "APK files found:"
        find . -name "*.apk" -type f
        
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: krama-release-apk
        path: |
          app/build/outputs/apk/release/app-release.apk
          !app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
        
    - name: Create Release (if tag pushed)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Krama Android App Release
          Built automatically from tag ${{ github.ref_name }}
          
          Features:
          - End-to-end encrypted messaging
          - Modern Material 3 design
          - Privacy-focused architecture
          - Offline-first capabilities
          
          Download the APK from the artifacts above.
        files: |
          app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}